name: Docker Build and Push

on:
  workflow_call:
    inputs:
      IS_DEV:
        type: boolean
        required: true
      IS_PROD:
        type: boolean
        required: true

    secrets:
      DOCKER_USERNAME:
        required: true
      DOCKER_PASSWORD:
        required: true

jobs:
  docker:
    runs-on: ubuntu-latest
    env:
      IMAGE_NAMESPACE: ${{ secrets.DOCKER_USERNAME }}
      IMAGE_NAME: konsulin-app

    steps:
      - name: Checkout Source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Set up mise (skip tool install)
        uses: jdx/mise-action@8418fedb1110381a0d3ba51a7a415d7c1b884550 # v5.2.2
        with:
          install: false

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Push Docker Image
        env:
          IS_DEV: ${{ inputs.IS_DEV }}
          IS_PROD: ${{ inputs.IS_PROD }}
          IMAGE_NAMESPACE: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
        run: |
          if [ "$IS_DEV" == "true" ]; then
            echo "Development build..."
            mise run --skip-tools docker:publish dev
          elif [ "$IS_PROD" == "true" ]; then
            echo "Production build..."
            mise run --skip-tools docker:publish prod
          else
            echo "No valid environment specified. Needs IS_DEV or IS_PROD true."
            exit 1
          fi
