name: Pull Request CI

on:
  pull_request:
    branches:
      - develop
      - rc

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install mise-managed tools (Go, Node)
        uses: jdx/mise-action@1648a7812b9aeae629881980618f079932869151 # v4

      - name: Cache Go modules
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/go
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Run Go tests
        run: make test-go

      - name: Build Go binary
        run: go build ./cmd/konsulin-app

      - name: Install npm dependencies
        run: npm ci

      - name: Lint changed JS/TS files
        run: |
          BASE_SHA="${{ github.event.pull_request.base.sha }}"
          git fetch origin "$BASE_SHA" --depth=1
          CHANGED="$(git diff --name-only "$BASE_SHA" HEAD --diff-filter=ACMR | grep -E '\.(js|jsx|ts|tsx)$' || true)"
          if [ -n "$CHANGED" ]; then
            echo "Linting changed files:"
            printf '%s\n' "$CHANGED"
            printf '%s\n' "$CHANGED" | xargs npx eslint --max-warnings 5
          else
            echo "No changed JS/TS files to lint"
          fi

      - name: Run Next.js build
        run: npm run build
