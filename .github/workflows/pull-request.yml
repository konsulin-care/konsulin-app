name: Pull Request CI

on:
  pull_request:
    branches:
      - develop
      - rc

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install mise-managed tools (Go, Node)
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4

      - name: Cache Go modules
        uses: actions/cache@v6
        with:
          path: |
            ~/.cache/go
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Run Go tests
        run: make test-go

      - name: Build Go binary
        run: go build ./cmd/konsulin-app

      - name: Install npm dependencies
        run: npm ci

      - name: Lint JS/TS
        uses: reviewdog/action-eslint@556a3fdaf8b4201d4d74d406013386aa4f7dab96 # v1.34.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          reporter: github-pr-check
          eslint_flags: "src/"
          fail_level: error

      - name: Run Next.js build
        run: npm run build
