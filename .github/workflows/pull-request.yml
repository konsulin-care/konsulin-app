name: Pull Request CI

on:
  pull_request:
    branches:
      - develop
      - rc

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install mise-managed tools (Go, golangci-lint, Node)
        uses: jdx/mise-action@8418fedb1110381a0d3ba51a7a415d7c1b884550 # v5.2.2
        with:
          install_args: go github:golangci/golangci-lint node github:hadolint/hadolint

      - name: Cache Go modules
        uses: actions/cache@v6
        with:
          path: |
            ~/.cache/go
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Run Go tests
        run: mise run --skip-tools test:go

      - name: Build Go binary
        run: mise run --skip-tools build:go

      - name: Run Go checks
        run: mise run --skip-tools check:go

      - name: Install dependencies
        run: mise run --skip-tools deps

      - name: Run JS tests
        run: mise run --skip-tools test:js

      - name: Lint JS/TS
        uses: reviewdog/action-eslint@3ee2a450da17e060b9dfa4bffd53976906c6b2b0 # v1.36.1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          reporter: github-pr-check
          eslint_flags: "src/"
          fail_level: error

      - name: Run Next.js build
        run: mise run --skip-tools build:next

      - name: Lint Dockerfile
        run: mise run --skip-tools lint:docker

      - name: Build Docker image
        run: mise run --skip-tools docker
