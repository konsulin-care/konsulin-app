name: Pull Request CI

on:
  pull_request:
    branches:
      - develop
      - rc

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install mise-managed tools (Go, Node)
        uses: jdx/mise-action@d5574b52816a478f9d4e6529a3f6ff17a8a36785 # v5.2.8

      - name: Cache Go modules
        uses: actions/cache@v6
        with:
          path: |
            ~/.cache/go
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Run Go tests
        run: make test-go

      - name: Build Go binary
        run: go build ./cmd/konsulin-app

      - name: Install npm dependencies
        run: npm ci

      - name: Lint JS/TS
        uses: reviewdog/action-eslint@6dad10dc50476699ad1ddbbb19bf55d36f311a39 # v1.37.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          reporter: github-pr-check
          eslint_flags: "src/"
          fail_level: error

      - name: Run Next.js build
        run: npm run build
