[settings]
lockfile = true
idiomatic_version_file_enable_tools = ["go"]

[env]
GOTOOLCHAIN = "local"

[hooks]
postinstall = "lefthook install"

[tools]
node = "24"
lefthook = "2.2.2"
"github:golangci/golangci-lint" = "2.15.0"
"github:hadolint/hadolint" = "2.14.0"

[tasks."test:go"]
description = "Run Go tests (default ./...; scope with packages)"
usage = '''
arg "[packages]" var=#true
flag "--run <regex>"
'''
run = '''
eval "set -- ${usage_packages:-./...}"
if [ -n "${usage_run:-}" ]; then
  go test "$@" -count=1 -run "$usage_run"
else
  go test "$@" -count=1
fi
'''

[tasks."test:js"]
description = "Run Vitest tests (default all; scope with files)"
usage = '''
arg "[files]" var=#true
'''
run = '''
eval "set -- ${usage_files:-}"
npx vitest run "$@"
'''

[tasks.test]
description = "Run all tests (Go + JS)"
depends = ["test:go", "test:js"]

[tasks.deps]
description = "Install npm and Go dependencies"
run = '''
npm ci
go mod download
'''

[tasks."fmt:go"]
description = "Format Go sources with gofmt -s; --check verifies without writing"
usage = '''
flag "--check"
'''
run = '''
if [ -n "${usage_check:-}" ]; then
  status=0
  diff="$(gofmt -s -d ./cmd/ ./internal/)" || status=$?
  if [ -n "$diff" ]; then
    printf '%s\n' "$diff"
    echo "Go formatting differs; run: mise run fmt:go" >&2
    exit 1
  fi
  if [ "$status" -ne 0 ]; then
    echo "gofmt failed (exit $status)" >&2
    exit "$status"
  fi
  echo "Go formatting is correct"
else
  gofmt -s -w ./cmd/ ./internal/
fi
'''

[tasks.typecheck]
description = "Type-check TypeScript (tsc --noEmit)"
run = "npx tsc --noEmit"

[tasks."lint:js"]
description = "Lint src/ with ESLint, failing on any warning"
run = "npx eslint src/ --max-warnings 0"

[tasks."check:js"]
description = "Run TypeScript type-check and ESLint"
depends = ["typecheck", "lint:js"]

[tasks."lint:go"]
description = "Run golangci-lint over all Go packages"
run = "golangci-lint run ./..."

[tasks."lint:docker"]
description = "Lint Dockerfile with hadolint"
run = "hadolint Dockerfile"

[tasks.docker]
description = "Build the Docker image with mise-pinned Go and Node versions"
run = '''
sh scripts/docker.sh \
  --build-arg GO_VERSION="$(mise current go)" \
  --build-arg NODE_VERSION="$(mise current node)"
'''

[tasks."docker:publish"]
description = "Build and push the Docker image for <env>"
usage = '''
arg "<env>" values=development|production
'''
run = '''
sh scripts/docker-publish.sh "${usage_env}" \
  --build-arg GO_VERSION="$(mise current go)" \
  --build-arg NODE_VERSION="$(mise current node)"
'''

[tasks."check:file-length"]
description = "Fail when files exceed the max line count (default 300)"
usage = '''
arg "[files]" var=#true
flag "--max <n>"
'''
run = '''
eval "set -- ${usage_files:-}"
if [ "$#" -eq 0 ]; then
  set -- $(git grep -L -e '^// Code generated' -- '*.go')
fi
if [ -n "${usage_max:-}" ]; then
  sh scripts/check-file-length.sh --max "$usage_max" "$@"
else
  sh scripts/check-file-length.sh "$@"
fi
'''

[tasks."check:go-mod"]
description = "Verify go.mod and go.sum are tidy (go mod tidy -diff)"
run = "sh scripts/check-go-mod.sh"

[tasks."check:go"]
description = "Run file-length, format, lint and vet checks"
depends = ["check:file-length", "fmt:go --check", "lint:go"]
run = "go vet ./..."

[tasks.build]
description = "Build Next.js static export and Go binary"
depends = ["build:next", "build:go"]

[tasks."build:go"]
description = "Compile the Go server binary"
usage = '''
flag "--output <path>"
'''
run = '''
go build -o "${usage_output:-konsulin-app}" ./cmd/konsulin-app
'''

[tasks."build:next"]
description = "Export the Next.js site into out/"
run = "npm run build"

[tasks.clean]
description = "Remove .next and out build directories"
run = "rm -rf .next out"

[tasks.dev]
description = "Run dev servers: full|go|next|static"
usage = '''
arg "[mode]" values=full|go|next|static default=full
flag "--go-port <port>" default=3000
flag "--next-port <port>" default=8000
'''
run = '''
sh scripts/dev.sh "${usage_mode:-full}" --go-port "${usage_go_port:-3000}" --next-port "${usage_next_port:-8000}"
'''

[tasks.start]
description = "Run the Go BFF server"
run = "go run ./cmd/konsulin-app"

[tasks.gen]
description = "Run data generator for <target>: wilayah|specialty"
usage = '''
arg "<target>"
'''
run = '''
case "${usage_target:-}" in
  wilayah|specialty)
    go generate "./internal/data/${usage_target}/"
    ;;
  *)
    echo "usage: gen <target> (wilayah|specialty)" >&2
    exit 1
    ;;
esac
'''
